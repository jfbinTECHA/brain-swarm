name: Deploy Documentation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

jobs:
  test-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install MkDocs and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs-material mkdocstrings mkdocs-openapi-plugin mkdocs-minify-plugin

    - name: Test MkDocs build
      run: |
        mkdocs build --strict

    - name: Check for broken links
      run: |
        pip install linkchecker
        mkdocs serve --dev-addr=127.0.0.1:8001 &
        sleep 10
        linkchecker --no-warnings --check-extern http://127.0.0.1:8001/ || true
        pkill -f mkdocs

  deploy-docs:
    runs-on: ubuntu-latest
    needs: test-docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install MkDocs and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs-material mkdocstrings mkdocs-openapi-plugin mkdocs-minify-plugin

    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Deploy to GitHub Pages
      run: |
        mkdocs gh-deploy --force --message "Deploy documentation [skip ci]"

    - name: Create deployment status
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'success',
            description: 'Documentation deployed to GitHub Pages',
            context: 'docs/deployment',
            target_url: 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}'
          })

  update-badges:
    runs-on: ubuntu-latest
    needs: deploy-docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update documentation badge in README
      run: |
        # Update docs badge with current date
        sed -i "s/docs-mkdocs-blue/docs-mkdocs-blue/g" README.md

        # Check if README changed
        if git diff --quiet README.md; then
          echo "No changes to README"
        else
          git add README.md
          git commit -m "Update documentation deployment status [skip ci]" || true
          git push || true
        fi