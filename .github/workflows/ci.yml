name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend install
        working-directory: frontend
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Frontend lint/build
        if: ${{ hashFiles('frontend/package.json') != '' }}
        working-directory: frontend
        run: |
          npm run lint || (echo "Frontend lint failed" && exit 1)
          npm run -s build || (echo "Frontend build failed" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backend install
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Backend test
        working-directory: api
        run: |
          if [ -d ../tests ]; then pytest ../tests/; fi

      - name: Backend import check
        working-directory: api
        run: |
          python - <<'PY'
          import importlib
          importlib.import_module("app.main")
          print("OK: app.main importable")
          PY

      - name: Backend health check
        working-directory: api
        run: |
          docker compose up -d api db redis
          sleep 10
          curl -s localhost:8001/healthz | jq

      - name: Helm lint (if charts present)
        run: |
          if [ -d helm ]; then
            curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            helm lint helm/* || true
          fi