name: CI\non: [push, pull_request]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Set up Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: 3.12\n      - name: Install dependencies\n        run: pip install -r backend/requirements.txt pytest ruff black isort\n      - name: Lint and test\n        run: |\n          ruff check .\n          pytest -v
