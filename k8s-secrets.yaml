# Kubernetes Secrets for Brain Swarm Production Deployment
# Apply with: kubectl apply -f k8s-secrets.yaml -n brainswarm

---
apiVersion: v1
kind: Secret
metadata:
  name: brain-swarm-cortex-secrets
  namespace: brainswarm
type: Opaque
stringData:
  # OpenAI API for embedding generation
  openai_api_key: "your-openai-api-key-here"

  # S3 configuration for long-term storage
  s3_bucket: "brain-swarm-cortex-archive"
  s3_region: "us-east-1"
  s3_access_key: "your-aws-access-key"
  s3_secret_key: "your-aws-secret-key"

  # Redis password (if using Redis with auth)
  redis_password: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: brain-swarm-webhook-secrets
  namespace: brainswarm
type: Opaque
stringData:
  # Jira configuration
  jira_base_url: "https://yourcompany.atlassian.net"
  jira_username: "brain-swarm-alerts@yourcompany.com"
  jira_api_token: "your-jira-api-token"

  # GitHub configuration
  github_owner: "your-org"
  github_repo: "incidents"
  github_token: "your-github-personal-access-token"

  # ServiceNow configuration
  servicenow_instance_url: "https://yourcompany.servicenow.com"
  servicenow_access_token: "your-servicenow-oauth-token"

---
apiVersion: v1
kind: Secret
metadata:
  name: brain-swarm-alertmanager-secrets
  namespace: brainswarm
type: Opaque
stringData:
  # Slack webhook for alerts
  slack_webhook_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"

  # SMTP configuration for email alerts
  email_password: "your-smtp-password"