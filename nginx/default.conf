upstream brainswarm_api {
    least_conn;
    server brain-swarm-api-1:8000 max_fails=3 fail_timeout=30s;
    server brain-swarm-api-2:8000 max_fails=3 fail_timeout=30s;
    server brain-swarm-api-3:8000 max_fails=3 fail_timeout=30s;
}

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=24h max_size=512m;

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://brainswarm_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_cache STATIC;
        proxy_pass http://dashboard:3000;
        proxy_cache_valid 200 1h;
        add_header X-Cache-Status $upstream_cache_status;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ACME challenge for Certbot verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# Optional HTTPS block (auto-enabled if certs mounted)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://api:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}