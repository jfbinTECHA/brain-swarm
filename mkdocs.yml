site_name: Brain Swarm Ops Documentation
site_description: Enterprise Incident Response Platform
site_author: Brain Swarm Team
site_url: https://jfbintecha.github.io/brain-swarm/

repo_url: https://github.com/jfbinTECHA/brain-swarm
repo_name: jfbinTECHA/brain-swarm
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2023 - 2024 Brain Swarm Team

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  logo: assets/brain.png
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jfbinTECHA/brain-swarm
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/jfbintecha/brain-swarm
  generator: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: jfbinTECHA
      repo: brain-swarm
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture.md
      - Data Flow: architecture-flow.md
      - Interactive Diagram: architecture_animation.html
  - Getting Started:
      - Installation: installation.md
      - Configuration: configuration.md
      - Run a Simulation: run-simulation.md
  - API Reference:
      - Overview: api/overview.md
      - OpenAPI Specification: api/openapi.md
      - Endpoints: api-reference.md
  - Examples:
      - Embedding Demo: examples/embedding_demo.py
      - Metrics Demo: examples/metrics_demo.py
  - Troubleshooting: troubleshooting.md

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - git-committers:
      repository: jfbinTECHA/brain-swarm
      branch: main
  - render_swagger

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

watch:
  - docs/
  - mkdocs.yml