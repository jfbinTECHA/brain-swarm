site_name: Brain Swarm API Documentation
site_description: Multi-Agent Swarm Intelligence System API Documentation
site_author: Brain Swarm Team

nav:
  - Home: index.md
  - API Reference:
    - Overview: api/overview.md
    - Endpoints: api/endpoints.md
    - Models: api/models.md
  - Monitoring & Observability: monitoring.md
  - Architecture: architecture.md
  - Deployment: deployment.md
  - Configuration: configuration.md

theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
  - openapi:
      openapi: docs/openapi.json

extra:
  generator: false

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.emoji
  - admonition
  - toc:
      permalink: true