version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: brainswarm-api
    ports:
      - "8001:8001"
    env_file:
      - api/.env.example
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/brainswarm
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: brainswarm-frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: brainswarm-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=brainswarm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: brainswarm-redis
    ports:
      - "6379:6379"

networks:
  default:
    name: brainswarm-net