version: "3.9"

# Environment configuration
env_file:
  - .env.production

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: brainswarm-api
    ports:
      - "8001:8001"
    env_file:
      - api/.env.example
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/brainswarm
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: brainswarm-dashboard
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://api:8001
      - NODE_ENV=production
    ports:
      - "3000:3000"
    command: "npm start"
    depends_on:
      - api
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m

  nginx-proxy:
    image: nginx:1.27
    container_name: brainswarm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cache:/var/cache/nginx
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - dashboard
      - api
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  certbot:
    image: certbot/certbot:latest
    container_name: brainswarm-certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt/live
      - ./nginx/letsencrypt:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               echo '🔄 Checking for renewed certificates...';
               if [ -n \"$(find /etc/letsencrypt/live -type f -mmin -5)\" ]; then
                 echo '✅ Certificate renewed! Reloading NGINX...';
                 docker exec brainswarm-nginx nginx -s reload || echo '⚠️ Failed to reload NGINX';
               else
                 echo 'ℹ️ No new certificates, skipping reload.';
               fi;
               sleep 12h & wait $!;
             done"
    depends_on:
      - nginx-proxy
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: brainswarm-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=brainswarm
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: brainswarm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  watchdog:
    image: python:3.12-slim
    container_name: brainswarm-watchdog
    working_dir: /app
    volumes:
      - ./tools:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HEALTH_API_URL=http://api:8001/healthz
      - HEALTH_INTERVAL=60
    command: ["python", "/app/health_watcher.py"]
    depends_on:
      - api
      - db
      - redis

volumes:
  redis_data:
  chroma_data:
  db-data:
  redis-data:

networks:
  default:
    name: brainswarm-net