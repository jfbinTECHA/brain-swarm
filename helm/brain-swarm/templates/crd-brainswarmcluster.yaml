apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: brainswarmclusters.swarm.brain.dev
spec:
  group: swarm.brain.dev
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              swarmId:
                type: string
                description: "Unique identifier for the swarm cluster"
              api:
                type: object
                properties:
                  replicas:
                    type: integer
                    default: 1
                    minimum: 1
                  image:
                    type: string
                    default: "brain-swarm:latest"
                  resources:
                    type: object
                    properties:
                      limits:
                        type: object
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                      requests:
                        type: object
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
              operations:
                type: object
                properties:
                  enabled:
                    type: boolean
                    default: true
                  replicas:
                    type: integer
                    default: 1
              redis:
                type: object
                properties:
                  enabled:
                    type: boolean
                    default: true
                  persistence:
                    type: object
                    properties:
                      size:
                        type: string
                        default: "8Gi"
              monitoring:
                type: object
                properties:
                  prometheus:
                    type: boolean
                    default: true
                  redisExporter:
                    type: boolean
                    default: true
            required:
            - swarmId
          status:
            type: object
            properties:
              phase:
                type: string
                enum: ["Pending", "Running", "Failed"]
              apiEndpoint:
                type: string
              operationsEndpoint:
                type: string
              agentCount:
                type: integer
              lastUpdated:
                type: string
                format: date-time
  scope: Namespaced
  names:
    plural: brainswarmclusters
    singular: brainswarmcluster
    kind: BrainSwarmCluster
    shortNames:
    - bsc