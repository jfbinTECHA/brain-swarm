{{- if .Values.monitoring.alertmanager.webhook.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "brain-swarm.fullname" . }}-cortex-ticket-sync
  labels:
    {{- include "brain-swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: cortex-ticket-sync
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ticket-sync
              image: "{{ .Values.monitoring.alertmanager.webhook.image.repository }}:{{ .Values.monitoring.alertmanager.webhook.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.monitoring.alertmanager.webhook.image.pullPolicy | default "IfNotPresent" }}
              command: ["python", "swarmops_ticket_sync.py", "--once"]
              env:
                - name: REDIS_URL
                  value: "redis://{{ include "brain-swarm.fullname" . }}-redis:6379"
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "brain-swarm.fullname" . }}-webhook-secrets
                      key: github_token
                - name: GITHUB_REPO
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "brain-swarm.fullname" . }}-webhook-secrets
                      key: github_repo
                - name: JIRA_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "brain-swarm.fullname" . }}-webhook-secrets
                      key: jira_base_url
                - name: JIRA_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "brain-swarm.fullname" . }}-webhook-secrets
                      key: jira_username
                - name: JIRA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "brain-swarm.fullname" . }}-webhook-secrets
                      key: jira_api_token
              resources:
                {{- toYaml .Values.monitoring.alertmanager.webhook.resources | nindent 14 }}
{{- end }}