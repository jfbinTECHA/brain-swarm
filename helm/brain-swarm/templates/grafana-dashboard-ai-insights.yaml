{{- if .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "brain-swarm.fullname" . }}-ai-insights-dashboard
  labels:
    {{- include "brain-swarm.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  ai-insights-dashboard.json: |
{{ .Files.Get "dashboards/ai-insights-dashboard.json" | indent 4 }}
{{- end }}