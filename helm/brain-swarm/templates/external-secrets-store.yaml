{{- if .Values.monitoring.externalSecrets.enabled }}
{{- if .Values.monitoring.externalSecrets.aws.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "brain-swarm.fullname" . }}-aws-secretsmanager
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.monitoring.externalSecrets.aws.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "brain-swarm.serviceAccountName" . }}
{{- end }}
{{- if .Values.monitoring.externalSecrets.vault.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "brain-swarm.fullname" . }}-vault
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  provider:
    vault:
      server: {{ .Values.monitoring.externalSecrets.vault.server }}
      path: {{ .Values.monitoring.externalSecrets.vault.path }}
      auth:
        kubernetes:
          mountPath: {{ .Values.monitoring.externalSecrets.vault.auth.kubernetes.mountPath }}
          role: {{ .Values.monitoring.externalSecrets.vault.auth.kubernetes.role }}
          serviceAccountRef:
            name: {{ include "brain-swarm.serviceAccountName" . }}
{{- end }}
{{- end }}