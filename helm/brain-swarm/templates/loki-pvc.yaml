{{- if and .Values.monitoring.loki.enabled .Values.monitoring.loki.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "brain-swarm.fullname" . }}-loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.monitoring.loki.persistence.size }}
  {{- if .Values.monitoring.loki.persistence.storageClass }}
  storageClassName: {{ .Values.monitoring.loki.persistence.storageClass }}
  {{- end }}
{{- end }}