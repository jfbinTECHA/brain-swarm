{{- if .Values.swarmops.bidirectionalSync.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brain-swarm.fullname" . }}-swarmops-secrets
  labels:
    {{- include "brain-swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: swarmops-secrets
type: Opaque
data:
  # GitHub credentials (base64 encoded)
  {{- if .Values.swarmops.bidirectionalSync.github.enabled }}
  github-token: {{ .Values.swarmops.bidirectionalSync.github.token | default "" | b64enc }}
  github-webhook-secret: {{ .Values.swarmops.bidirectionalSync.github.webhookSecret | default "" | b64enc }}
  {{- end }}

  # Jira credentials (base64 encoded)
  {{- if .Values.swarmops.bidirectionalSync.jira.enabled }}
  jira-username: {{ .Values.swarmops.bidirectionalSync.jira.username | default "" | b64enc }}
  jira-api-token: {{ .Values.swarmops.bidirectionalSync.jira.apiToken | default "" | b64enc }}
  {{- end }}

  # ServiceNow credentials (base64 encoded)
  {{- if .Values.swarmops.bidirectionalSync.servicenow.enabled }}
  servicenow-access-token: {{ .Values.swarmops.bidirectionalSync.servicenow.accessToken | default "" | b64enc }}
  {{- end }}
{{- end }}