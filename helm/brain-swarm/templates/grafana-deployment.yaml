{{- if .Values.monitoring.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brain-swarm.fullname" . }}-grafana
  labels:
    {{- include "brain-swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: {{ .Values.monitoring.grafana.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "brain-swarm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "brain-swarm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/grafana-config.yaml") . | sha256sum }}
        checksum/assets: {{ include (print $.Template.BasePath "/grafana-assets.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "brain-swarm.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.monitoring.grafana.podSecurityContext | nindent 8 }}
      containers:
        - name: grafana
          securityContext:
            {{- toYaml .Values.monitoring.grafana.securityContext | nindent 12 }}
          image: {{ .Values.monitoring.grafana.image.repository }}:{{ .Values.monitoring.grafana.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.monitoring.grafana.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_PATHS_CONFIG
              value: /etc/grafana/grafana.ini
            - name: GF_PATHS_DATA
              value: /var/lib/grafana/data
            - name: GF_PATHS_LOGS
              value: /var/lib/grafana/logs
            - name: GF_PATHS_PLUGINS
              value: /var/lib/grafana/plugins
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: login-page
              mountPath: /usr/share/grafana/public/views/login.html
              subPath: login.html
            - name: assets
              mountPath: /usr/share/grafana/public/img
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: storage
              mountPath: /var/lib/grafana
          resources:
            {{- toYaml .Values.monitoring.grafana.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "brain-swarm.fullname" . }}-grafana-config
            items:
              - key: grafana.ini
                path: grafana.ini
        - name: login-page
          configMap:
            name: {{ include "brain-swarm.fullname" . }}-grafana-config
            items:
              - key: login.html
                path: login.html
        - name: assets
          configMap:
            name: {{ include "brain-swarm.fullname" . }}-grafana-assets
        - name: dashboards
          configMap:
            name: {{ include "brain-swarm.fullname" . }}-cortex-dashboard
        - name: provisioning-dashboards
          configMap:
            name: {{ include "brain-swarm.fullname" . }}-grafana-config
            items:
              - key: dashboards.yml
                path: dashboards.yml
        - name: provisioning-datasources
          configMap:
            name: {{ include "brain-swarm.fullname" . }}-grafana-config
            items:
              - key: datasources.yml
                path: datasources.yml
        - name: storage
          {{- if .Values.monitoring.grafana.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "brain-swarm.fullname" . }}-grafana
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.monitoring.grafana.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.monitoring.grafana.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.monitoring.grafana.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}