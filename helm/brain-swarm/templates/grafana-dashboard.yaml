{{- if .Values.cortex.enabled }}
{{- if .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "brain-swarm.fullname" . }}-cortex-dashboard
  labels:
    {{- include "brain-swarm.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    app.kubernetes.io/component: grafana-dashboard
data:
  cortex-overview.json: |
{{ .Files.Get "dashboards/cortex-overview.json" | indent 4 }}
{{- end }}
{{- end }}