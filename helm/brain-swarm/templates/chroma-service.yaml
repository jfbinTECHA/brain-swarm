{{- if .Values.cortex.enabled }}
{{- if .Values.cortex.chroma.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "brain-swarm.fullname" . }}-chroma
  labels:
    {{- include "brain-swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: chroma
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.cortex.chroma.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "brain-swarm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: chroma
{{- end }}
{{- end }}