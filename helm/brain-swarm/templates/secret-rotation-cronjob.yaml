{{- if .Values.monitoring.externalSecrets.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "brain-swarm.fullname" . }}-secret-rotation
  labels:
    app.kubernetes.io/name: secret-rotation
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: "0 2 * * *"  # Run daily at 2 AM
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: secret-rotation
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          serviceAccountName: {{ include "brain-swarm.serviceAccountName" . }}
          containers:
          - name: secret-rotation
            image: amazonlinux:2
            imagePullPolicy: IfNotPresent
            command:
            - /bin/bash
            - -c
            - |
              # Install AWS CLI
              yum update -y && yum install -y awscli jq

              # Run rotation script
              /scripts/rotate-secrets.sh
            env:
            - name: AWS_REGION
              value: {{ .Values.monitoring.externalSecrets.aws.region | quote }}
            - name: CLUSTER_NAME
              value: {{ .Release.Name }}
            - name: NAMESPACE
              value: {{ .Release.Namespace }}
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: aws-credentials
              mountPath: /root/.aws
              readOnly: true
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
          volumes:
          - name: scripts
            configMap:
              name: {{ include "brain-swarm.fullname" . }}-rotation-scripts
              defaultMode: 0755
          - name: aws-credentials
            secret:
              secretName: {{ include "brain-swarm.fullname" . }}-aws-credentials
          restartPolicy: OnFailure
          {{- with .Values.monitoring.externalSecrets.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.monitoring.externalSecrets.affinity }}
          affinity:
            {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.monitoring.externalSecrets.tolerations }}
          tolerations:
            {{- toYaml . | nindent 10 }}
          {{- end }}
{{- end }}