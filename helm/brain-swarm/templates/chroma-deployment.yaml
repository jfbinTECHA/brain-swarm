{{- if .Values.cortex.enabled }}
{{- if .Values.cortex.chroma.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brain-swarm.fullname" . }}-chroma
  labels:
    {{- include "brain-swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: chroma
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "brain-swarm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: chroma
  template:
    metadata:
      labels:
        {{- include "brain-swarm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: chroma
    spec:
      containers:
        - name: chroma
          image: "{{ .Values.cortex.chroma.image.repository }}:{{ .Values.cortex.chroma.image.tag }}"
          imagePullPolicy: {{ .Values.cortex.chroma.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.cortex.chroma.service.port }}
              protocol: TCP
          env:
            - name: CHROMA_SERVER_HOST
              value: "0.0.0.0"
            - name: CHROMA_SERVER_HTTP_PORT
              value: "{{ .Values.cortex.chroma.service.port }}"
            - name: CHROMA_SERVER_CORS_ALLOW_ORIGINS
              value: '["*"]'
          volumeMounts:
            - name: chroma-data
              mountPath: /chroma/.chroma
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 10 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.cortex.chroma.resources | nindent 12 }}
      volumes:
        - name: chroma-data
          {{- if .Values.cortex.chroma.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "brain-swarm.fullname" . }}-chroma-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 6 }}
        {{- end }}
      {{- with .Values.cortex.chroma.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cortex.chroma.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cortex.chroma.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}