{{- if .Values.monitoring.externalSecrets.enabled }}
{{- range $secretName, $secretConfig := .Values.monitoring.externalSecrets.secrets }}
{{- if $secretConfig.rotationEnabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "brain-swarm.fullname" $ }}-{{ $secretName }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  refreshInterval: {{ $secretConfig.rotationInterval }}
  secretStoreRef:
    name: {{ include "brain-swarm.fullname" $ }}-aws-secretsmanager
    kind: SecretStore
  target:
    name: {{ $.Values.secrets.name }}
    creationPolicy: Owner
  data:
  - secretKey: {{ $secretName }}
    remoteRef:
      key: {{ $secretConfig.awsSecretName }}
      property: value
---
{{- end }}
{{- end }}
{{- end }}