# Default values for brain-swarm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Brain Swarm API settings
api:
  enabled: true
  replicaCount: 1

  image:
    repository: brain-swarm
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000
    annotations: {}

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  config:
    environment: production
    node:
      swarmId: "default-swarm"
      host: "0.0.0.0"
      port: 8000
      maxAgents: 10
      maxAgentLoad: 3
    database:
      url: "sqlite:///data/brain_swarm.db"
    logging:
      level: INFO
    federation:
      enabled: false
    scalability:
      enabled: false
      messageQueueMode: "single_node"
      redisUrls: ["redis://redis:6379"]
      partitions: 8
      asyncAgentsEnabled: false
      agentPoolMin: 1
      agentPoolMax: 10
      loadBalancingStrategy: "least_loaded"
      multiClusterEnabled: false
      clusterId: "default-cluster"
      clusterRole: "primary"
      autoScalingEnabled: false
    security:
      jwtSecret: "change-this-in-production"
      jwtAlgorithm: "HS256"
      jwtExpirationHours: 24

# Operations Server settings
operations:
  enabled: true
  replicaCount: 1

  image:
    repository: brain-swarm
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8001
    annotations: {}

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Ticket Bridge microservice (optional standalone service for ticket synchronization)
ticketBridge:
enabled: false  # Set to true to deploy as separate microservice
image:
repository: brain-swarm-swarmops-hook
tag: "latest"
pullPolicy: IfNotPresent
replicas: 1
redisUrl: "redis://brain-swarm-redis:6379"
enablePolling: true
pollIntervalSeconds: 600
resources:
limits:
 cpu: 250m
 memory: 256Mi
requests:
 cpu: 100m
 memory: 128Mi

# Redis settings
redis:
  enabled: true

  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  service:
    port: 6379

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  persistence:
    enabled: true
    size: 8Gi

# Redis Exporter settings
redisExporter:
  enabled: true

  image:
    repository: oliver006/redis_exporter
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    port: 9121

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Ingress settings
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: brain-swarm.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Service account settings
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod security context
podSecurityContext: {}

# Security context
securityContext: {}

# Additional volumes
extraVolumes: []
extraVolumeMounts: []

# Environment variables
extraEnvVars: []

# Knowledge Cortex settings
cortex:
  enabled: false
  summarizer:
    enabled: true
    schedule: "*/15 * * * *"  # Every 15 minutes
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 2
  chroma:
    enabled: true
    image:
      repository: chromadb/chroma
      tag: "0.4.18"
      pullPolicy: IfNotPresent
    service:
      port: 8000
    persistence:
      enabled: true
      size: 10Gi
  s3:
    enabled: false
    bucket: "brain-swarm-cortex"
    region: "us-east-1"
    endpointUrl: ""
  persistence:
    enabled: true
    size: 20Gi

# Swarm View Dashboard settings
swarmview:
  enabled: false
  replicas: 1
  image:
    repository: brain-swarm-swarmview
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    nodePort: ""
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Monitoring configuration
monitoring:
  grafana:
    enabled: true
  prometheus:
    enabled: false
  alertmanager:
    enabled: false
    smtp:
      enabled: false
      smarthost: "smtp.gmail.com:587"
      from: "alerts@brainswarm.ai"
      username: "alerts@brainswarm.ai"
    slack:
      enabled: false
      webhookUrl: ""
      channel: "#brainswarm-alerts"
    webhook:
      enabled: false
      url: "https://brainswarm.ai/alert-hook"
      image:
        repository: brain-swarm-swarmops-hook
        tag: "latest"
        pullPolicy: IfNotPresent
      service:
        type: ClusterIP
        port: 8080
        nodePort: ""
      replicas: 1
      defaultSystem: "jira"  # Default ticket system
      criticalSystem: "jira"  # System for critical alerts
      jira:
        enabled: false
        projectKey: "ALERT"
      github:
        enabled: false
        repo: "brain-swarm"  # Repository for GitHub Actions integration
      servicenow:
        enabled: false
        assignmentGroup: ""
      brainSwarmApiUrl: "http://brain-swarm-api.brainswarm.svc.cluster.local:8000"
      kilo:
        image: "jfbintecha/swarmops-hook:latest"
        manifest: "kilo/manifest.json"
        jwtAudience: "kilo-agents"
        jwtScope: "incident:read,incident:write"
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      extraEnvVars:
        - name: JWT_AUDIENCE
          value: "kilo-agents"
        - name: JWT_SCOPE
          value: "incident:read,incident:write"
      nodeSelector: {}
      tolerations: []
      affinity: {}