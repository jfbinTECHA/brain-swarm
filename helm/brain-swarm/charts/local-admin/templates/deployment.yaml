apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "local-admin.fullname" . }}
  labels:
    {{- include "local-admin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "local-admin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "local-admin.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "local-admin.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "local_admin_app:app", "--host", "0.0.0.0", "--port", "{{ .Values.config.adminPanelPort }}"]
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: ADMIN_PANEL_PORT
              value: "{{ .Values.config.adminPanelPort }}"
            - name: ADMIN_PANEL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "local-admin.fullname" . }}-secret
                  key: jwt_secret
            - name: ALLOW_REGISTRATION
              value: "{{ .Values.config.allowRegistration }}"
            - name: BRAIN_SWARM_BASE_URL
              value: "{{ .Values.config.brainSwarmBaseUrl }}"
            - name: BRAIN_SWARM_API_KEY
              value: "{{ .Values.config.brainSwarmApiKey }}"
          volumeMounts:
            - name: dashboards-config
              mountPath: /app/dashboards.json
              subPath: dashboards.json
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: dashboards-config
          configMap:
            name: {{ include "local-admin.fullname" . }}-dashboards
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}