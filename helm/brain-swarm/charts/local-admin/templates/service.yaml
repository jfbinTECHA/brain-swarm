apiVersion: v1
kind: Service
metadata:
  name: {{ include "local-admin.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "local-admin.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http