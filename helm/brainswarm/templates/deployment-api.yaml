apiVersion: apps/v1
kind: Deployment
metadata:
  name: brainswarm-api
  labels:
    app: brainswarm-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: brainswarm-api
  template:
    metadata:
      labels:
        app: brainswarm-api
    spec:
      containers:
        - name: brainswarm-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.apiPort }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}