global:
  resolve_timeout: 5m

  # Optional SMTP configuration for email alerts
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@brainswarm.ai'
  smtp_auth_username: 'alerts@brainswarm.ai'
  smtp_auth_password: '<EMAIL_PASSWORD>'

route:
  receiver: 'default'
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

  routes:
    - match:
        severity: critical
      receiver: 'slack-critical'
      continue: true
    - match:
        severity: warning
      receiver: 'slack-warning'
      continue: true
    - match:
        severity: info
      receiver: 'webhook-info'

receivers:
  - name: 'default'
    email_configs:
      - to: 'ops@brainswarm.ai'
        send_resolved: true

  - name: 'slack-critical'
    slack_configs:
      - api_url: '<SLACK_WEBHOOK_URL>'
        channel: '#brainswarm-alerts'
        title: '[CRITICAL] {{ .CommonLabels.alertname }}'
        text: >-
          *Severity:* {{ .CommonLabels.severity }}\n
          *Description:* {{ .CommonAnnotations.description }}\n
          *Summary:* {{ .CommonAnnotations.summary }}\n
          *Instance:* {{ .CommonLabels.instance }}\n
          *Triggered:* {{ .StartsAt }}
        send_resolved: true

  - name: 'slack-warning'
    slack_configs:
      - api_url: '<SLACK_WEBHOOK_URL>'
        channel: '#brainswarm-alerts'
        title: '[WARNING] {{ .CommonLabels.alertname }}'
        text: >-
          *Severity:* {{ .CommonLabels.severity }}\n
          *Summary:* {{ .CommonAnnotations.summary }}\n
          *Description:* {{ .CommonAnnotations.description }}
        send_resolved: true

  - name: 'webhook-info'
    webhook_configs:
      - url: 'http://swarmops-hook.brainswarm.svc.cluster.local:80/alert-hook'
        send_resolved: true