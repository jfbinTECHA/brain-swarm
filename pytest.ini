[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --asyncio-mode=auto
    -v
    --tb=short
    --cov=brain_swarm
    --cov=cortex
    --cov=swarmops_bidirectional_sync
    --cov=swarmops_hook
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
markers =
    asyncio: marks tests as async (using pytest-asyncio)
    integration: marks tests as integration tests
    slow: marks tests as slow running
    webhook: marks tests related to webhook functionality
    sync: marks tests related to bi-directional sync
    cortex: marks tests related to cortex functionality
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning