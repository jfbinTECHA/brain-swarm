<svg width="595" height="842" viewBox="0 0 595 842" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brainGradientPDF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64b5f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGradientPDF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64b5f6;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#4CAF50;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="595" height="842" fill="url(#backgroundGradient)"/>

  <!-- Decorative background elements -->
  <circle cx="100" cy="150" r="80" fill="url(#glowGradientPDF)" opacity="0.3"/>
  <circle cx="495" cy="692" r="60" fill="url(#glowGradientPDF)" opacity="0.2"/>
  <circle cx="450" cy="200" r="40" fill="url(#glowGradientPDF)" opacity="0.4"/>

  <!-- Main brain logo -->
  <g transform="translate(297.5, 250)">
