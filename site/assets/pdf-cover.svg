    <path d="M0 -80c-13.5 0-26 4.5-36 13.5-10 9-15 22.5-9 36 6 13.5 18 22.5 31.5 22.5s25.5-9 31.5-22.5c6-13.5 1-27-9-36C26 -75.5 13.5 -80 0 -80z" fill="url(#brainGradientPDF)" filter="url(#glow)"/>
