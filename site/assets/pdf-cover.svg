    <!-- Neural connections -->
    <line x1="0" y1="-60" x2="-30" y2="-10" stroke="url(#brainGradientPDF)" stroke-width="3" opacity="0.8"/>
    <line x1="0" y1="-60" x2="30" y2="-10" stroke="url(#brainGradientPDF)" stroke-width="3" opacity="0.8"/>
    <line x1="-30" y1="10" x2="-45" y2="35" stroke="url(#brainGradientPDF)" stroke-width="3" opacity="0.8"/>
    <line x1="30" y1="10" x2="45" y2="35" stroke="url(#brainGradientPDF)" stroke-width="3" opacity="0.8"/>
    <line x1="-30" y1="10" x2="0" y2="60" stroke="url(#brainGradientPDF)" stroke-width="3" opacity="0.8"/>
    <line x1="30" y1="10" x2="0" y2="60" stroke="url(#brainGradientPDF)" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- Title -->
  <text x="297.5" y="480" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="48" font-weight="bold">Brain Swarm</text>
  <text x="297.5" y="520" text-anchor="middle" fill="#64b5f6" font-family="Arial, sans-serif" font-size="24" font-weight="300">Enterprise Incident Response Platform</text>

  <!-- Subtitle/Version -->
  <text x="297.5" y="570" text-anchor="middle" fill="#b0b0b0" font-family="Arial, sans-serif" font-size="18">Documentation v1.0.0</text>

  <!-- Decorative lines -->
  <line x1="150" y1="620" x2="445" y2="620" stroke="url(#brainGradientPDF)" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="650" x2="395" y2="650" stroke="url(#brainGradientPDF)" stroke-width="1" opacity="0.4"/>

  <!-- Footer -->
  <text x="297.5" y="720" text-anchor="middle" fill="#808080" font-family="Arial, sans-serif" font-size="14">Multi-Agent Swarm Intelligence System</text>
  <text x="297.5" y="750" text-anchor="middle" fill="#808080" font-family="Arial, sans-serif" font-size="12">© 2023 Brain Swarm Team</text>

  <!-- Small accent elements -->
  <circle cx="100" cy="750" r="3" fill="url(#brainGradientPDF)" opacity="0.8"/>
  <circle cx="495" cy="750" r="3" fill="url(#brainGradientPDF)" opacity="0.8"/>
</svg>