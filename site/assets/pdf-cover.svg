    <path d="M-36 48c-9 0-18 4.5-22.5 13.5-4.5 9-4.5 22.5 4.5 31.5 9 9 22.5 13.5 36 9 13.5-4.5 22.5-18 22.5-31.5C46 52.5 37 48 28 48z" fill="url(#brainGradientPDF)" filter="url(#glow)"/>
