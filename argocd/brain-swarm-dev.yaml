apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: brain-swarm-dev
  namespace: argocd
  labels:
    environment: development
spec:
  project: default
  source:
    repoURL: https://github.com/jfbinTECHA/brain-swarm
    targetRevision: HEAD
    path: helm/brain-swarm
    helm:
      valueFiles:
        - values-dev.yaml
      parameters:
        - name: bridge.image
          value: jfbintecha/swarmops-hook:latest
        - name: cortex.image
          value: jfbintecha/knowledge-cortex:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: brainswarm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10