apiVersion: kilo.ai/v1
kind: ConfigMap
metadata:
  name: prom-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      # - "first_rules.yml"
      # - "second_rules.yml"

    scrape_configs:
      - job_name: 'local-admin'
        static_configs:
          - targets: ['local-admin:8060']
        metrics_path: '/metrics'
        scrape_interval: 5s

      - job_name: 'brain-swarm-core'
        static_configs:
          - targets: ['brainswarm-core:8000']
        metrics_path: '/metrics'
        scrape_interval: 10s

      - job_name: 'zeta-dashboard'
        static_configs:
          - targets: ['zeta:3000']
        metrics_path: '/metrics'
        scrape_interval: 30s

      - job_name: 'kilo-console'
        static_configs:
          - targets: ['kilo-console:8080']
        metrics_path: '/metrics'
        scrape_interval: 30s