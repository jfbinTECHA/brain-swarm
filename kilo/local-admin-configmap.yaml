apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboards-config
  namespace: brain-swarm
data:
  dashboards.json: |
    [
      {
        "name": "Mission Control",
        "url": "/mission-control",
        "status": "UP",
        "description": "Real-time swarm coordination dashboard"
      },
      {
        "name": "Grafana",
        "url": "http://grafana.brain-swarm.svc.cluster.local",
        "status": "UP",
        "description": "Metrics visualization and monitoring"
      },
      {
        "name": "Prometheus",
        "url": "http://prometheus.brain-swarm.svc.cluster.local",
        "status": "UP",
        "description": "Time-series metrics collection"
      },
      {
        "name": "Brain-Swarm API",
        "url": "/docs",
        "status": "UP",
        "description": "REST API documentation and testing"
      }
    ]