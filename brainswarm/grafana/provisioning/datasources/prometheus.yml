apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 30s

  - name: BrainSwarm Watchdog File Exporter
    type: prometheus
    access: proxy
    url: file:///home/sysop/brainswarm/logs/watchdog_metrics.prom
    isDefault: false
    editable: true