# =====================================================================
# 🧠  BrainSwarm Cortex Summarizer — Prometheus Scrape Config
# ---------------------------------------------------------------------
# Add this job block to your Prometheus config or include it directly.
# The summarizer exporter listens on port 9201 (localhost).
# =====================================================================

scrape_configs:
  - job_name: "brainswarm-summarizer"
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9201"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "brainswarm-cortex"

    # Optional: scrape every 15s for near real-time dashboard updates
    scrape_interval: 15s

    # Add labels to integrate into the BrainSwarm Ops cluster topology
    labels:
      component: "cortex-summarizer"
      environment: "local"