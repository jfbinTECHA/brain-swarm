---
# SwarmOps Alert Webhook Handler - Combined Deployment and Service
# Apply with: kubectl apply -f templates/swarmops-hook.yaml -n brainswarm

apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmops-hook
  namespace: brainswarm
  labels:
    app: swarmops-hook
    component: alert-webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swarmops-hook
  template:
    metadata:
      labels:
        app: swarmops-hook
        component: alert-webhook
    spec:
      containers:
        - name: swarmops-hook
          image: brain-swarm-swarmops-hook:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: DEFAULT_TICKET_SYSTEM
              value: "jira"
            - name: CRITICAL_TICKET_SYSTEM
              value: "servicenow"
            # Jira configuration
            - name: JIRA_ENABLED
              value: "true"
            - name: JIRA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: brain-swarm-webhook-secrets
                  key: jira_base_url
            - name: JIRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: brain-swarm-webhook-secrets
                  key: jira_username
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: brain-swarm-webhook-secrets
                  key: jira_api_token
            - name: JIRA_PROJECT_KEY
              value: "ALERT"
            # GitHub configuration
            - name: GITHUB_ENABLED
              value: "true"
            - name: GITHUB_OWNER
              valueFrom:
                secretKeyRef:
                  name: brain-swarm-webhook-secrets
                  key: github_owner
            - name: GITHUB_REPO
              valueFrom:
                secretKeyRef:
                  name: brain-swarm-webhook-secrets
                  key: github_repo
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: brain-swarm-webhook-secrets
                  key: github_token
            # ServiceNow configuration
            - name: SERVICENOW_ENABLED
              value: "true"
            - name: SERVICENOW_INSTANCE_URL
              valueFrom:
                secretKeyRef:
                  name: brain-swarm-webhook-secrets
                  key: servicenow_instance_url
            - name: SERVICENOW_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: brain-swarm-webhook-secrets
                  key: servicenow_access_token
            - name: SERVICENOW_ASSIGNMENT_GROUP
              value: "Platform Engineering"
            # GitHub Actions integration
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: brain-swarm-webhook-secrets
                  key: github_token
            - name: GITHUB_OWNER
              valueFrom:
                secretKeyRef:
                  name: brain-swarm-webhook-secrets
                  key: github_owner
            - name: GITHUB_REPO
              value: "brain-swarm"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: swarmops-hook
  namespace: brainswarm
  labels:
    app: swarmops-hook
    component: alert-webhook
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: swarmops-hook

---
# Network Policy for SwarmOps Hook
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: swarmops-hook-network-policy
  namespace: brainswarm
spec:
  podSelector:
    matchLabels:
      app: swarmops-hook
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring  # Allow from monitoring namespace (Alertmanager)
        - podSelector:
            matchLabels:
              app: alertmanager  # Allow from Alertmanager pods
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to: []  # Allow all outbound for API calls to external services
      ports:
        - protocol: TCP
          port: 443  # HTTPS for external APIs
        - protocol: TCP
          port: 80   # HTTP fallback

---
# ConfigMap for additional configuration (optional)
apiVersion: v1
kind: ConfigMap
metadata:
  name: swarmops-hook-config
  namespace: brainswarm
data:
  # Additional configuration can be added here
  log_level: "INFO"
  ticket_creation_timeout: "30"
  duplicate_check_window: "3600"  # 1 hour